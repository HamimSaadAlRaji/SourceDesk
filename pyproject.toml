[project]
name = "aegis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.10",
    "fastapi>=0.142.2",
    "fastembed>=0.8.0",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "instructor[google-genai]>=1.15.4",
    "langchain-community<0.4",
    "langfuse>=4.15.6",
    "matplotlib>=3.11.1",
    "openai>=2.54,<3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas<0.4",
    "ranx>=0.3.21",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aegis = "aegis:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Phase 16 (design record 16a). The CI lint gate. The rule set is explicit because
# ruff changes its *default* rules between releases (0.17.1 reports ~103 findings
# on this repo with defaults, 45 with this list), and ruff is pinned for the same reason.
[tool.ruff]
line-length = 120  # style only; E501 is not selected, so this is never a gate

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

# Phase 16 (design record 16a). Type-check gate on the modules where a silent bug
# corrupts every downstream measurement (CLAUDE.md section 6). The rest of src/ is
# not gated yet -- see docs/future-work.md.
[tool.mypy]
python_version = "3.12"
files = [
    "src/aegis/analysis",
    "src/aegis/chunking",
    "src/aegis/retrieval/fusion.py",
    "src/aegis/guardrails/confidence.py",
    "src/aegis/guardrails/citations.py",
    "src/aegis/router/policy.py",
    "src/aegis/eval/metrics.py",
    "src/aegis/eval/gate.py",
    "src/aegis/eval/ci_index.py",
    "src/aegis/eval/ci_fixtures.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
