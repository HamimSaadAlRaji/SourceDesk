[project]
name = "aegis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.10",
    "fastembed>=0.8.0",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "instructor[google-genai]>=1.15.4",
    "langchain-community<0.4",
    "langfuse>=4.15.6",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas<0.4",
    "ranx>=0.3.21",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
]

[project.scripts]
aegis = "aegis:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
