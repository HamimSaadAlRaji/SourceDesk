# Phase 16, unit 16d (design record docs/explainers/16d-eval-workflow.md).
# The evaluation gate: scores the pipeline against the frozen golden set and fails
# the build when a metric falls outside its tolerance band around the committed
# baseline (ci/baselines/). test.yml is the cheap always-on floor; this is the gate.
#
# Tiers (plan.md Phase 16 step 3):
#   push to a branch  -> test.yml only
#   pull_request      -> this workflow (full gate)
#   push to main      -> this workflow, so "green on main" is a measured fact
#   workflow_dispatch -> this workflow, on demand (baseline re-measurement, dry runs)
# Two jobs run in parallel:
#   retrieval-gate  restored index, no LLM, $0
#   llm-gate        real OpenAI calls (model-availability probe + router eval), capped at
#                   $0.15 per run by the spend ledger. Never runs on push-to-main (merges
#                   never spend money) and never on fork PRs (secrets are withheld there).
name: eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per event type: a manual dispatch must not cancel the push-to-main run that proves
  # green-on-main (it did, on 2026-10-24), and a later push must not cancel a dispatch.
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retrieval-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3 # same tag as docker-compose.yml and the fixtures' manifest
        ports:
          - 6333:6333
        env:
          # Without this, a 2-core runner merges the restored segments and rebuilds
          # HNSW: recall@10 0.2687 instead of 0.4317 on the same snapshot (first
          # hosted run). The restore step refuses to proceed if this is unset.
          QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: "0"

    env:
      QDRANT_HOST: localhost
      # The restored chunks.jsonl is mandatory here: a missing corpus fails the
      # tenant-bypass tests instead of skipping them (see tests/security).
      AEGIS_REQUIRE_CORPUS: "1"
      FIXTURES_TAG: ci-fixtures-v1

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      # bge-large is ~1.3 GB. It is re-downloadable from Hugging Face, so a cache
      # miss costs time, never correctness -- the one thing the Actions cache is for
      # here (the snapshot, which is not re-creatable, is a release asset).
      - name: Cache Hugging Face models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-bge-large-en-v1.5

      - name: Download CI fixtures (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$FIXTURES_TAG" --dir ci-fixtures

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && exit 0
            sleep 2
          done
          echo "Qdrant did not become healthy" >&2
          exit 1

      # Verifies SHA-256 against MANIFEST.json, loads the snapshot, checks the
      # collection is green with the manifest's point count.
      - name: Restore index
        run: uv run --frozen python -m aegis.eval.ci_fixtures restore --src ci-fixtures

      - name: Tenant-bypass tests on the real corpus
        run: uv run --frozen pytest tests/security -q -rs

      - name: Retrieval metrics
        run: uv run --frozen python -m aegis.eval.retrieval_gate run --fixtures ci-fixtures --out results/retrieval.json

      # Exit 1 when any metric is outside its band, or the comparison is not clean.
      - name: Compare with baseline
        run: uv run --frozen python -m aegis.eval.retrieval_gate compare --current results/retrieval.json --markdown results/retrieval.md

      # Always: a failing run is the one whose numbers you most want to read.
      - name: Job summary
        if: always()
        run: |
          if [ -f results/retrieval.md ]; then cat results/retrieval.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: results/
          if-no-files-found: warn

  llm-gate:
    # push-to-main: no spend. fork PRs: no secrets. workflow_dispatch and same-repo PRs: run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # The ledger refuses any call whose worst case would pass this, before the provider
      # is contacted -- a hard per-run cap, not an after-the-fact alert. Fresh ledger per
      # run (uploaded as an artifact), so the cap is per run, not per project.
      OPENAI_BUDGET_USD: "0.15"
      OPENAI_LEDGER_PATH: results/ci_spend.sqlite

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Require the API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not set (gh secret set OPENAI_API_KEY)" >&2
            exit 1
          fi

      # One tiny real call per configured model (~$0.0001). gpt-4.1-nano was removed
      # from the API while /v1/models still listed it; only a real call proves a model works.
      - name: Model availability
        run: uv run --frozen python -m aegis.eval.model_probe

      - name: Router metrics
        run: uv run --frozen python -m aegis.eval.router_gate run --out results/router.json

      - name: Compare with baseline
        run: uv run --frozen python -m aegis.eval.router_gate compare --current results/router.json --markdown results/router.md

      - name: Job summary
        if: always()
        run: |
          if [ -f results/router.md ]; then cat results/router.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f results/ci_spend.sqlite ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**OpenAI spend this run:**' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            uv run --frozen python -m aegis.cost >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-results
          path: results/
          if-no-files-found: warn
