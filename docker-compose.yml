services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333" # HTTP + dashboard
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
