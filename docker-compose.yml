services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    # Phase 15 (design record 15f): loopback only. Was 0.0.0.0/[::], which let
    # anyone on the LAN read, write and delete collections without credentials.
    ports:
      - "127.0.0.1:6333:6333" # HTTP + dashboard
      - "127.0.0.1:6334:6334" # gRPC
    # Both keys come from .env (compose reads it for interpolation); startup
    # fails loudly if either is missing rather than running unauthenticated.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in .env}
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
